name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci
      - run: npm run cli:version
      - run: npm run cli:local-version
      - run: npm run network:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:contract-surface
      - run: npm run test:python
      - run: npm run test:mutations
      - run: npm run test:direct
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium-desktop
      - run: npm run build
      - run: npm run audit

